name: Trigger ReadTheDocs Build
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  rtd-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RTD build
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
          RTD_SLUG: ${{ secrets.RTD_SLUG }}
        run: |
          if [[ "${CI_PIPELINE_SOURCE}" == "push" ]]; then
            BRANCH="${CI_COMMIT_BRANCH}"
          else
            BRANCH="${CI_PULL_REQUEST_SOURCE_BRANCH_NAME}"
          fi
          echo "Trigger build for branch: $BRANCH"
          curl -X POST "https://readthedocs.org/api/v3/projects/${RTD_SLUG}/versions/${BRANCH}/builds/" \
            -H "Authorization: Token ${RTD_TOKEN}"
